name: srl-evpn-type5-irb
prefix: ""

topology:
  kinds:
    nokia_srlinux:
      type: ixr-d2l
      image: ghcr.io/nokia/srlinux:26.3.1
      startup-config: startup/__clabNodeName__.srl.cfg
    linux:
      image: ghcr.io/srl-labs/network-multitool:latest

  nodes:
    spine1:
      kind: nokia_srlinux
    spine2:
      kind: nokia_srlinux
    leaf1:
      kind: nokia_srlinux
    leaf2:
      kind: nokia_srlinux
    leaf3:
      kind: nokia_srlinux
    leaf4:
      kind: nokia_srlinux

    app1:
      kind: linux
      exec:
        - ip addr add 192.168.10.1/24 dev eth1
        - ip route add 192.168.0.0/16 dev eth1 via 192.168.10.254
    web1:
      kind: linux
      exec:
        - ip addr add 192.168.20.1/24 dev eth1
        - ip route add 192.168.0.0/16 dev eth1 via 192.168.20.254

    app2:
      kind: linux
      exec:
        - ip addr add 192.168.10.2/24 dev eth1
        - ip route add 192.168.0.0/16 dev eth1 via 192.168.10.254
    web2:
      kind: linux
      exec:
        - ip addr add 192.168.20.2/24 dev eth1
        - ip route add 192.168.0.0/16 dev eth1 via 192.168.20.254

    app3:
      kind: linux
      exec:
        - ip addr add 192.168.10.3/24 dev eth1
        - ip route add 192.168.0.0/16 dev eth1 via 192.168.10.254
    web3:
      kind: linux
      exec:
        - ip addr add 192.168.20.3/24 dev eth1
        - ip route add 192.168.0.0/16 dev eth1 via 192.168.20.254

    app4:
      kind: linux
      exec:
        - ip addr add 192.168.10.4/24 dev eth1
        - ip route add 192.168.0.0/16 dev eth1 via 192.168.10.254
    web4:
      kind: linux
      exec:
        - ip addr add 192.168.20.4/24 dev eth1
        - ip route add 192.168.0.0/16 dev eth1 via 192.168.20.254

  links:
    - endpoints: [ "spine1:e1-1", "leaf1:e1-1" ]
    - endpoints: [ "spine1:e1-2", "leaf2:e1-1" ]
    - endpoints: [ "spine1:e1-3", "leaf3:e1-1" ]
    - endpoints: [ "spine1:e1-4", "leaf4:e1-1" ]
    - endpoints: [ "spine2:e1-1", "leaf1:e1-2" ]
    - endpoints: [ "spine2:e1-2", "leaf2:e1-2" ]
    - endpoints: [ "spine2:e1-3", "leaf3:e1-2" ]
    - endpoints: [ "spine2:e1-4", "leaf4:e1-2" ]
    - endpoints: [ "leaf1:e1-3", "app1:eth1" ]
    - endpoints: [ "leaf1:e1-4", "web1:eth1" ]
    - endpoints: [ "leaf2:e1-3", "app2:eth1" ]
    - endpoints: [ "leaf2:e1-4", "web2:eth1" ]
    - endpoints: [ "leaf3:e1-3", "app3:eth1" ]
    - endpoints: [ "leaf3:e1-4", "web3:eth1" ]
    - endpoints: [ "leaf4:e1-3", "app4:eth1" ]
    - endpoints: [ "leaf4:e1-4", "web4:eth1" ]
